Object GondorSoldier
    Behavior = AutoHealBehavior ModuleTag_Heal
    End
    #include "includes/death.inc"
End
ChildObject GondorSoldierVeteran GondorSoldier
    RemoveModule ModuleTag_Death
    RemoveModule ModuleTag_Missing
    ReplaceModule ModuleTag_Heal
        Behavior = AutoHealBehavior ModuleTag_Heal2
        End
    End
    ReplaceModule ModuleTag_Body
        Body = ActiveBody ModuleTag_Body2
        End
    End
    Behavior = AutoHealBehavior ModuleTag_Own
    End
    RemoveModule ModuleTag_Own
End
Object GondorArcher
    Body = ActiveBody ModuleTag_Body
    End
    Draw = W3DScriptedModelDraw ModuleTag_Body
    End
    #include "includes/death.inc"
    #include "includes/death.inc"
End
ChildObject GondorSoldierElite GondorSoldier
    RemoveModule moduletag_heal
End
ChildObject GondorSoldierVeteranElite GondorSoldierVeteran
    RemoveModule ModuleTag_Death
    RemoveModule ModuleTag_Heal2
End
ChildObject GondorSoldierHero GondorSoldier
    RemoveModule ModuleTag_Death
    RemoveModule ModuleTag_Death
End
ChildObject GondorSoldierGuard GondorSoldier
    ReplaceModule ModuleTag_Heal
        Behavior = AutoHealBehavior ModuleTag_Heal
        End
    End
    ReplaceModule ModuleTag_Death
        Behavior = AutoHealBehavior ModuleTag_GuardDeath
        End
    End
End
