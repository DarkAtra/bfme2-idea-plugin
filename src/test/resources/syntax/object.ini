; Mallorn tree of the elves
Object ElvenMallornTree
    ; *** ART Parameters ***
    Draw = W3DScriptedModelDraw ModuleTag_Draw
        OkToChangeModelColor = Yes
        DefaultModelConditionState
            Model = EBMalTree
            ParticleSysBone = FireFlyBone FireFlies02 FollowBone:Yes
        End
        ModelConditionState = DAMAGED
            Model = EBMalTree_D
        End
    End

    DisplayName = OBJECT:ElvenMallornTree // shown in the tooltip
    Side = Elves
    KindOf = PRELOAD STRUCTURE SELECTABLE -- trees are structures
    BuildCost = 1200
    BuildTime = 45.5
    VisionRange = 300%
    Geometry = CYLINDER
    GeometryMajorRadius = 30.0
    CommandSet = ElvenMallornTreeCommandSet

    Behavior = AutoHealBehavior ModuleTag_Heal
        HealingAmount = 5
        HealingDelay = 1000
        StartsActive = Yes
    End
    Body = ActiveBody ModuleTag_Body
        MaxHealth = 2500
    End
End
