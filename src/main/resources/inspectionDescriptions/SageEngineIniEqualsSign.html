<body>
Reports properties whose <code>=</code> doesn't match their block. Properties of an <code>Object</code> are written with <code>=</code>, e.g.
<code>CommandSet = Foo</code> instead of <code>CommandSet Foo</code>, while <code>RemoveModule</code> is always written without it, e.g.
<code>RemoveModule ModuleTag_Death</code>.
</body>
