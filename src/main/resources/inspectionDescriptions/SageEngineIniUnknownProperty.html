Reports properties that the enclosing block doesn't support, e.g. <code>HealingAmount</code> outside an <code>AutoHealBehavior</code>.
<p>The properties of <code>Options.ini</code>, which has no blocks, are checked against the known game settings.</p>
<p>Properties of unknown blocks are not reported.</p>
