Reports blocks and modules that the engine doesn't know, e.g. a misspelled <code>Behavior = AutoHealBehaviour</code> module.
<p>Blocks that are only allowed in one file are reported in every other file, e.g. a <code>MissionObjectiveList</code> outside of
<code>map.ini</code>.</p>
<p>Blocks nested in unknown blocks are not reported.</p>
